apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokensre-decision-api
  labels: {app.kubernetes.io/name: tokensre}
spec:
  replicas: 3
  selector:
    matchLabels: {app.kubernetes.io/name: tokensre}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tokensre}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/metrics"}
    spec:
      serviceAccountName: tokensre
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: decision-api
          image: ghcr.io/aah20/tokensre:1.0.0
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 5}
          env:
            - {name: TOKENSRE_ENV, value: production}
          envFrom:
            - secretRef: {name: tokensre-gateway-secrets}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: tokensre}}
---
apiVersion: v1
kind: Service
metadata:
  name: tokensre-decision-api
spec:
  selector: {app.kubernetes.io/name: tokensre}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tokensre}
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: tokensre}
spec:
  minAvailable: 2
  selector: {matchLabels: {app.kubernetes.io/name: tokensre}}
