apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokensre-decision-api
  labels: {app.kubernetes.io/name: tokensre}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: tokensre}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tokensre}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: decision-api
          image: ghcr.io/aah20/tokensre:0.2.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: tokensre-decision-api
spec:
  selector: {app.kubernetes.io/name: tokensre}
  ports: [{name: http, port: 80, targetPort: http}]
