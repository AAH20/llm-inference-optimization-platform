apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokensre-inference-placeholder
  namespace: tokensre
spec:
  replicas: 2
  selector:
    matchLabels: {app: tokensre-inference}
  template:
    metadata:
      labels: {app: tokensre-inference}
    spec:
      containers:
        - name: openai-compatible-placeholder
          image: python:3.13-alpine
          command: ["sh", "-c", "echo no GPU inference is claimed; sleep 3600"]
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tokensre-inference
  namespace: tokensre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tokensre-inference-placeholder
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
