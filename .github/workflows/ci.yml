name: LLM inference optimization CI
on:
  push:
  pull_request:
jobs:
  route-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m tokensre.cli examples/multi-cloud-model-routing/45b-tokens.json --output generated/45b-token-routing
      - run: git diff --exit-code generated/45b-token-routing
      - run: python -m compileall -q src tests
