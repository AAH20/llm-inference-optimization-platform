[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensre"
version = "0.1.0"
description = "LLM inference optimization, model routing, AI gateway and GPU FinOps evaluation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]

[project.scripts]
tokensre = "tokensre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
