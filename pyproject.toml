[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensre"
version = "1.0.0"
description = "LLM inference optimization, model routing, AI gateway and GPU FinOps evaluation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
tokensre = "tokensre.cli:main"
tokensre-gateway = "tokensre.gateway:main"

[tool.setuptools.packages.find]
where = ["src"]
